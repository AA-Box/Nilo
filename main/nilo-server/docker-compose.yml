# nilo-server, standalone.
#   cp docker-compose.yml /srv/nilo/ && cd /srv/nilo && mkdir -p data models
#   docker compose up -d
# The server reads its user config from ./data/.config.yaml (mounted below);
# NILO_* environment variables override server host/ports and log level.
services:
  nilo-server:
    image: ghcr.io/aa-box/nilo-server:latest
    container_name: nilo-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
      - NILO_SERVER_HOST=0.0.0.0
      - NILO_SERVER_PORT=8000
      - NILO_HTTP_PORT=8003
      - NILO_LOG_LEVEL=INFO
    ports:
      - "8000:8000"   # WebSocket session server (/nilo/v1/)
      - "8003:8003"   # HTTP: OTA bootstrap (/nilo/ota/) and /mcp/vision/explain
    volumes:
      - ./data:/opt/nilo-server/data
      # Local ASR model weights (FunASR SenseVoiceSmall) are not in the image; mount them if you use FunASR.
      - ./models/SenseVoiceSmall/model.pt:/opt/nilo-server/models/SenseVoiceSmall/model.pt
