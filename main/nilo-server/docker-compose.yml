# nilo-server, standalone.
#   cp docker-compose.yml /srv/nilo/ && cd /srv/nilo && mkdir -p data models
#   docker compose up -d
# The server reads its user config from ./data/.config.yaml (mounted below);
# NILO_* environment variables override server host/ports and log level.
services:
  nilo-server:
    image: ghcr.io/aa-box/nilo-server:latest
    container_name: nilo-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
      - NILO_SERVER_HOST=0.0.0.0
      - NILO_SERVER_PORT=8000
      - NILO_HTTP_PORT=8003
      - NILO_LOG_LEVEL=INFO
      # The management API. Bound to loopback inside the container and not published below,
      # so it is reachable only from this host; the healthcheck runs inside the container.
      # Publish 8010 and set NILO_ROBOT_API_ALLOW_REMOTE_CONTROL only deliberately
      # (docs/robot-api.md).
      - NILO_ROBOT_ADMIN_TOKEN_FILE=/run/secrets/nilo_admin_token
    secrets:
      - nilo_admin_token
    ports:
      - "8000:8000"   # WebSocket session server (/nilo/v1/)
      - "8003:8003"   # HTTP: OTA bootstrap (/nilo/ota/) and /mcp/vision/explain
    volumes:
      - ./data:/opt/nilo-server/data
      # Local ASR model weights (FunASR SenseVoiceSmall) are not in the image; mount them if you use FunASR.
      - ./models/SenseVoiceSmall/model.pt:/opt/nilo-server/models/SenseVoiceSmall/model.pt
    healthcheck:
      # Readiness rather than liveness: unhealthy while the robot runtime is closing, which
      # is what a rolling restart needs to see before it sends traffic (docs/observability.md).
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/ready',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

secrets:
  nilo_admin_token:
    # `echo "$(openssl rand -hex 32)" > ./secrets/nilo_admin_token` before the first start.
    # With no token the management API refuses every authenticated route — it fails closed.
    file: ./secrets/nilo_admin_token
