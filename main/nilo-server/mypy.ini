; mypy configuration for nilo-server.
;
; A separate file rather than a [tool.mypy] block in the vendored
; pyproject.toml — see .ruff.toml and docs/upstream.md.
;
; Upstream code is untyped and stays that way: `mypy .` is not a goal and would
; produce thousands of errors. Type checking is scoped to new first-party robot
; code, which is written with full annotations from the start.
;
;   mypy robot          # what CI runs once robot/ exists (Phase 0 of the roadmap)

[mypy]
python_version = 3.12
files = robot
namespace_packages = True
explicit_package_bases = True
mypy_path = .
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
pretty = True

; Strict for robot code.
[mypy-robot.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
no_implicit_optional = True
warn_return_any = True
strict_equality = True

; The upstream server has no type information and no stubs. Robot code that
; imports it must not inherit thousands of errors.
[mypy-core.*]
ignore_errors = True
follow_imports = skip

[mypy-config.*]
ignore_errors = True
follow_imports = skip

[mypy-plugins.*]
ignore_errors = True
follow_imports = skip

[mypy-plugins_func.*]
ignore_errors = True
follow_imports = skip

; Third-party packages that ship no type information.
[mypy-opuslib_next.*,funasr.*,silero_vad.*,cnlunar.*,loguru.*,ormsgpack.*,aioconsole.*]
ignore_missing_imports = True

; Optional vision dependencies. robot/vision imports all three lazily, inside the one
; function that needs them, and runs without any of them (docs/robot-vision.md) — so they
; are absent from requirements-dev.txt and from the CI lint job on purpose.
[mypy-cv2,cv2.*,numpy,numpy.*,ultralytics,ultralytics.*]
ignore_missing_imports = True

; aiohttp is in requirements.txt but not in requirements-dev.txt, and robot/api imports it
; lazily inside build_app so the dev slice runs without it (docs/robot-memory.md).
[mypy-aiohttp,aiohttp.*]
ignore_missing_imports = True

; websockets is typed and ships py.typed, so this is a no-op when it is installed. It is
; here because the CI lint job installs requirements-dev.txt only, and robot/simulator/
; imports websockets (lazily, inside the session) from the full requirements.
[mypy-websockets.*]
ignore_missing_imports = True
