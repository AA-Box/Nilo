    type: openai
    # api_key: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen-flash
    api_key: <your-aliyun-bailian-api-key>
    temperature: 0.7  # sampling temperature
    max_tokens: 500   # max generated tokens
    top_p: 1
    frequency_penalty: 0  # frequency penalty
  AliAppLLM:
    # LLM API type
    type: AliBL
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    app_id: <your-bailian-app-id>
    # api_key: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    api_key: <your-aliyun-bailian-api-key>
