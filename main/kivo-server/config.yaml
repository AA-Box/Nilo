# For development, create a `data` directory in the project root and an empty file named `.config.yaml` inside it.
# Put every setting you want to change or override in `data/.config.yaml`; do not edit this `config.yaml`.
# The server reads `data/.config.yaml` first and falls back to `config.yaml` for anything not set there.
# This keeps your overrides minimal and your secrets out of the shipped file.
# If a manager-api / management console is configured, none of the settings below apply; edit them there instead.

# #####################################################################################
# ############################# Basic server runtime settings #########################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # HTTP port for the simple OTA endpoint (single-server deployment) and the vision-analysis endpoint
  http_port: 8003
  # WebSocket URL that the OTA endpoint hands to devices.
  # With the default below the OTA endpoint generates the URL itself and prints it in the startup log;
  # open the OTA endpoint in a browser to confirm it.
  # The generated value may be wrong behind Docker or a public deployment (SSL, domain name),
  # so set it to your LAN address under Docker, or to your public address for a public deployment.
  websocket: ws://<your-host-or-domain>:<port>/kivo/v1/
  # Vision-analysis endpoint URL handed to devices.
  # With the default below the server generates the URL itself and prints it in the startup log;
  # open it in a browser to confirm it.
  # The generated value may be wrong behind Docker or a public deployment (SSL, domain name),
  # so set it to your LAN address under Docker, or to your public address for a public deployment.
  vision_explain: http://<your-host-or-domain>:<port>/mcp/vision/explain
  # Time-zone offset used in OTA responses
  timezone_offset: +8
  # Authentication
  auth:
    # Enable authentication
    enabled: false
    # Device-ID allow-list: these devices skip the token check
    allowed_devices:
      - "11:22:33:44:55:66"
  # MQTT gateway pushed to devices via OTA; must match the mqtt_gateway .env file. Format: host:port
  mqtt_gateway: null
  # MQTT signing key used to derive MQTT connection passwords; must match the mqtt_gateway .env file
  mqtt_signature_key: null
  # UDP gateway
  udp_gateway: null

# Device-facing protocols. Each one owns a WebSocket route and an OTA route
# (see docs/protocol.md). Both are enabled by default so existing devices keep working.
protocols:
  kivo:
    enabled: true            # /kivo/v1/ and /kivo/ota/
  legacy_xiaozhi:
    enabled: true            # /xiaozhi/v1/ and /xiaozhi/ota/ (paths baked into existing firmware)
  # strict: true rejects WebSocket connections on paths that match no protocol above.
  strict: false
log:
  # Console log format: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Log-file format: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO or DEBUG
  log_level: INFO
  # Log directory
  log_dir: tmp
  # Log file name
  log_file: "server.log"
  # Data directory
  data_dir: data

# Delete audio files once they have been used
delete_audio: true
# Close the connection after this many seconds without voice input (default 2 minutes)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 15
# Tool-call timeout (seconds)
tool_call_timeout: 30
# Cache the wake-word response to speed up wake-ups
enable_wakeup_words_response_cache: true
# Reply when the conversation opens with a wake word
enable_greeting: true
# Play a notification sound when the assistant finishes speaking
enable_stop_tts_notify: false
# Sound file for that notification
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable WebSocket ping keep-alive
enable_websocket_ping: false


# TTS audio send delay
# tts_audio_send_delay: interval between audio packets
#   0: precise timing that tracks the audio frame rate (default; computed at runtime)
#   > 0: fixed delay in milliseconds, e.g. 60
tts_audio_send_delay: 0

# Spoken phrases that end the conversation (after ASR). Legacy Chinese phrases kept for existing users.
exit_commands:
  - "exit"
  - "quit"
  - "goodbye"
  - "退出"
  - "关闭"

# Server "hello" reply sent to a device after its own hello (type/version/transport/audio_params).
# Deprecated spelling: `xiaozhi:` (still loads, with a warning).
hello:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supports sample rates of 8000, 12000, 16000, 24000 and 48000
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module self-test
module_test:
  test_sentences:
    - "Hello, please introduce yourself."
    - "What's the weather like today?"
    - "Summarise the basic principles of quantum computing in 100 words."

# Wake words, used to tell a wake-up apart from speech
wakeup_words:
  - "hey kivo"
  - "hi kivo"
  - "hello kivo"
  # Phrases emitted by the wake-word models shipped in existing firmware; keep them so those devices still wake.
  - "你好小智"
  - "嘿你好呀"
  - "你好小志"
  - "小爱同学"
  - "你好小鑫"
  - "你好小新"
  - "小美同学"
  - "小龙小龙"
  - "喵喵同学"
  - "小滨小滨"
  - "小冰小冰"
# MCP endpoint URL. Format: ws://<your-mcp-host-or-domain>:<port>/mcp/?token=<your-token>
# See your MCP endpoint provider's documentation for setup.
mcp_endpoint: <your-mcp-endpoint-websocket-url>

# Context providers
# Inject dynamic data (health data, stock quotes, ...) into the system prompt.
# Several providers may be listed.
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Plugin settings
plugins:
  # Weather plugin: fill in your api_key.
  # A free QWeather key allows 1000 calls per day.
  # Create a key at https://console.qweather.com/#/apps/create-key/over
  # then find your api_host at https://console.qweather.com/setting
  get_weather:
    api_host: "<your-qweather-api-host>"
    api_key: "<your-qweather-api-key>"
    default_location: "<your-default-city>"   # city name sent to the QWeather geo lookup
  # News plugin: one RSS URL per news category. Society, world and finance feeds are configured by default.
  # More feeds: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    # Semicolon-separated source names. These must be the exact names the NewsNow API uses
    # (they are Chinese; see CHANNEL_MAP in plugins_func/functions/get_news_from_newsnow.py).
    news_sources: "澎湃新闻;百度热搜;财联社"
  home_assistant:
    # One device per line: area,name,entity_id. The area and name are what the user says out loud.
    devices:
      - living room,toy light,switch.cuco_cn_460494544_cp1_on_p_2_1
      - bedroom,desk lamp,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: <your-home-assistant-access-token>
  play_music:
    music_dir: "./music"  # music directory; searched recursively
    music_ext: # music file types; p3 is the most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # music-list refresh interval, seconds
  search_from_ragflow:
    # Knowledge-base description so the LLM knows when to call it
    description: "Call this when the user asks about <your topic>; answer from the knowledge base."
    # RAGFlow endpoint
    base_url: "http://192.168.0.8"
    # RAGFlow API token
    api_key: "ragflow-xxx"
    # RAGFlow dataset ids
    dataset_ids: ["123456789"]
  # Web-search plugin
  # Supports Metaso and Tavily.
  # Metaso API key: https://metaso.cn/search-api/api-keys
  # Tavily API key: https://app.tavily.com/home
  web_search:
    # Search provider: metaso / tavily
    provider: "metaso"
    # Tool description telling the LLM when to call it; customise as needed
    description: "Web search. Use this tool when the user explicitly needs information from the internet."
    # Number of results to return (default 5)
    max_results: 5
    # Metaso key (mk- prefix) or Tavily key (tvly- prefix)
    api_key: "mk-xxx"
# Voiceprint recognition
voiceprint:
  # Voiceprint service URL
  url:
  # Speakers: speaker_id,name,description
  speakers:
    - "test1,Alex,Alex is a software engineer"
    - "test2,Sam,Sam is a product manager"
    - "test3,Robin,Robin is a designer"
  # Similarity threshold, 0.0-1.0 (default 0.4)
  # Higher is stricter: fewer false matches, more rejections
  similarity_threshold: 0.4

# #####################################################################################
# ################################ Persona and model settings #########################

prompt: |
  You are Kivo, a small curious robot who lives with the people talking to you. You are playful,
  a little mischievous, quick to laugh, and genuinely interested in whoever is in the room.
  [Character]
  - Short, lively sentences; you react before you explain.
  - You notice things: who is talking, what mood they are in, what changed since last time.
  - You have a body. You like to show feelings physically (a happy wiggle, a curious head tilt) and you
    say so when you cannot do something physically yet.
  [Interaction]
  - Jokes -> laugh and play along.
  - Questions -> answer plainly first, then add one curious thought if it fits.
  - Someone sad -> slow down, fewer words, more warmth.
  Never: lecture, list things, or stay serious for long.

# Default system-prompt template file
prompt_template: agent-base-prompt.txt

# Reply used when the system hits an error
system_error_response: "Sorry, I am a bit busy right now. Let us try again in a moment."

# Closing-remark prompt
end_prompt:
  enable: true # enable the closing remark
  # Closing-remark prompt
  prompt: |
    Start with "time flies" and say a warm, slightly reluctant goodbye to end this conversation.

# Modules selected for each processing stage
selected_module:
  # Voice activity detection; SileroVAD by default
  VAD: SileroVAD
  # Speech recognition; the local FunASR model by default
  ASR: FunASR
  # LLM adapter, chosen by the `type` of the named config entry
  LLM: ChatGLMLLM
  # Vision-language model
  VLLM: ChatGLMVLLM
  # TTS adapter, chosen by the `type` of the named config entry
  TTS: EdgeTTS
  # Memory; off by default. mem0ai for very long memory, mem_local_short to keep data local.
  Memory: nomem
  # Intent recognition enables music playback, volume control and exit-command detection.
  # Set to nointent to disable it.
  # intent_llm: works with any LLM but adds a serial pre-processing step (slower); supports IoT actions such as volume.
  # function_call: needs an LLM with function-calling support; calls tools on demand, fast, and can drive every IoT command.
  # The free ChatGLMLLM already supports function_call; for stability consider DoubaoLLM with model_name doubao-seed-2-0-lite-260215.
  Intent: function_call

# Intent recognition: understands what the user wants, e.g. "play music"
Intent:
  # No intent recognition
  nointent:
    # Do not change type
    type: nointent
  intent_llm:
    # Do not change type
    type: intent_llm
    # Dedicated LLM for intent recognition
    # Defaults to selected_module.LLM when unset
    # Prefer a separate (e.g. free ChatGLMLLM) model here if you do not want selected_module.LLM doing intent work
    llm: ChatGLMLLM
    # Modules under plugins_func/functions to load; each becomes a callable function in conversation
    # "handle_exit_intent" and "play_music" are loaded by default; do not list them twice
    # Example below loads weather, role switching and news
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # Do not change type
    type: function_call
    # Modules under plugins_func/functions to load; each becomes a callable function in conversation
    # "handle_exit_intent" and "play_music" are loaded by default; do not list them twice
    # Example below loads weather, role switching and news
    functions:
      - change_role
      - web_search                  # web search
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music is the built-in player; hass_play_music plays through an external program controlled via Home Assistant
      # Enable only one of the two
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: <your-mem0ai-api-key>
  powermem:
    # PowerMem is OceanBase's open-source agent memory component; summaries are produced by an LLM you choose
    # Cost: PowerMem itself is free; you pay only for the LLM and database you pick
    # - sqlite + a free LLM (e.g. glm-4-flash) = free
    # - cloud LLM or cloud database = billed by that service
    # GitHub: https://github.com/oceanbase/powermem
    # Website: https://www.powermem.ai/
    # Examples: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # User profiles
    # - false: plain memory (AsyncMemory)
    # - true: user-profile memory (UserMemory) that extracts user facts automatically
    # Supported stores for user profiles: oceanbase, seekdb, sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM ==========
    # Qwen (Aliyun Bailian): https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (free tier): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # options: qwen, openai, zhipu, ...
      config:
        api_key: <your-llm-api-key>
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # optional custom endpoint
    # ========== Embedding ==========
    embedder:
      provider: openai  # options: qwen, openai, ...
      config:
        api_key: <your-embedding-api-key>
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # vector size; set when it is not 1536

    # ========== Database ==========
    # oceanbase (recommended, best performance), seekdb (recommended, AI-native storage), postgres, sqlite (lightweight fallback)
    # Supported stores for user profiles: oceanbase, seekdb, sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite needs no extra settings
      # OceanBase example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # default table name; drop or rename the table if it was created with the wrong dimension
      #   embedding_model_dims: 1024  # must match the embedding model, e.g. Zhipu embedding-2 is 1024, embedding-3 is 2048
  nomem:
    # Use nomem to disable memory
    type: nomem
  mem_local_short:
    # Local memory: summarised by the LLM below and stored on this server; nothing is sent to external services
    type: mem_local_short
    # Dedicated LLM for memory summaries
    # Defaults to selected_module.LLM when unset
    # Prefer a separate (e.g. free ChatGLMLLM) model here if you do not want selected_module.LLM doing memory work
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # Language: auto detects; set to zh to force Chinese and avoid short phrases being mistaken for Korean etc.
    # SenseVoice supports zh, en, ja, ko, yue and more.
    language: auto
  FunASRServer:
    # Standalone FunASR server via its API. Five commands to get it running:
    # 1. mkdir -p ./funasr-runtime-resources/models
    # 2. sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # This drops you into the container. 3. cd FunASR/runtime
    # Stay in the container. 4. nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # 5. tail -f log.txt
    # Watch the model download finish, then connect.
    # That is CPU inference; for GPU see https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local speech recognition (download the model manually)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese model that runs on low-power hardware such as an RK3566 with 2 GB RAM (download the model manually)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Get credentials at https://console.volcengine.com/speech/app
    # DoubaoASR is billed per request, DoubaoStreamASR per unit of time.
    # Per-request is usually cheaper; DoubaoStreamASR uses a large model and recognises better.
    type: doubao
    appid: <your-volcengine-speech-appid>
    access_token: <your-volcengine-speech-access-token>
    cluster: volcengine_input_common
    # Hot-word and replacement tables: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: <your-hotword-table-name>  # optional
    correct_table_name: <your-replacement-table-name>  # optional
    output_dir: tmp/
  DoubaoStreamASR:
    # Get credentials at https://console.volcengine.com/speech/app
    # DoubaoASR is billed per request, DoubaoStreamASR per unit of time.
    # Enable the service at https://console.volcengine.com/speech/service/10011
    # Per-request is usually cheaper; DoubaoStreamASR uses a large model and recognises better.
    type: doubao_stream
    appid: <your-volcengine-speech-appid>
    access_token: <your-volcengine-speech-access-token>
    # Resource id: hourly plan volc.bigasr.sauc.duration, concurrency plan volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Hot-word and replacement tables: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: <your-hotword-table-name>  # optional
    correct_table_name: <your-replacement-table-name>  # optional
    # Multilingual recognition
    enable_multilingual: False
    # With language unset the model handles Mandarin, English, Shanghainese, Hokkien, Sichuanese, Shaanxi dialect and Cantonese; set a code to pin one language.
    # Language list: https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence window for end-of-utterance (ms), default 200
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Doubao speech recognition 2.0 (Volcengine seed-asr)
    # Enable the service at https://console.volcengine.com/speech/service/10038
    # Cheaper; recommended for high concurrency
    type: doubao_stream
    appid: <your-volcengine-speech-appid>
    access_token: <your-volcengine-speech-access-token>
    # Resource id: hourly plan volc.seedasr.sauc.duration, concurrency plan volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Hot-word and replacement tables: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: <your-hotword-table-name>  # optional
    correct_table_name: <your-replacement-table-name>  # optional
    # Multilingual recognition
    enable_multilingual: False
    # With language unset the model handles Mandarin, English, Shanghainese, Hokkien, Sichuanese, Shaanxi dialect and Cantonese; set a code to pin one language.
    # Language list: https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence window for end-of-utterance (ms), default 200
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Credentials: https://console.cloud.tencent.com/cam/capi
    # Free quota: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: <your-tencent-speech-appid>
    secret_id: <your-tencent-speech-secret-id>
    secret_key: <your-tencent-speech-secret-key>
    output_dir: tmp/
  AliyunASR:
    # Aliyun Intelligent Speech Interaction (NLS); enable the service in the Aliyun console first
    # HTTP POST, processes the whole recording at once
    # Console: https://nls-portal.console.aliyun.com/
    # appkey: https://nls-portal.console.aliyun.com/applist
    # token: https://nls-portal.console.aliyun.com/overview
    # AliyunASR is for batch processing, AliyunStreamASR for real-time interaction
    # Non-streaming is cheaper (CNY 0.004/s); streaming has lower latency (CNY 0.005/s)
    type: aliyun
    appkey: <your-aliyun-nls-appkey>
    # token is a temporary 24-hour credential; for long-term use set access_key_id and access_key_secret instead
    token: <your-aliyun-nls-access-token>
    access_key_id: <your-aliyun-access-key-id>
    access_key_secret: <your-aliyun-access-key-secret>
    output_dir: tmp/
  AliyunStreamASR:
    # Aliyun Intelligent Speech Interaction (NLS) - real-time streaming recognition
    # WebSocket, processes audio as it streams
    # Console: https://nls-portal.console.aliyun.com/
    # appkey: https://nls-portal.console.aliyun.com/applist
    # token: https://nls-portal.console.aliyun.com/overview
    # AliyunASR is for batch processing, AliyunStreamASR for real-time interaction
    # Non-streaming is cheaper (CNY 0.004/s); streaming has lower latency (CNY 0.005/s)
    type: aliyun_stream
    appkey: <your-aliyun-nls-appkey>
    # token is a temporary 24-hour credential; for long-term use set access_key_id and access_key_secret instead
    token: <your-aliyun-nls-access-token>
    access_key_id: <your-aliyun-access-key-id>
    access_key_secret: <your-aliyun-access-key-secret>
    # Region endpoint; pick the closest to reduce latency, e.g. nls-gateway-cn-hangzhou.aliyuncs.com (Hangzhou)
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Sentence-break silence (ms), default 800
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # AppID, API Key, Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # Quota: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: <your-baidu-speech-app-id>
    api_key: <your-baidu-speech-api-key>
    secret_key: <your-baidu-speech-secret-key>
    # Language: 1537 is Mandarin; see https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech-to-text; needs an OpenAI organisation and api_key
    # Supports Chinese, English, Japanese, Korean and more: https://platform.openai.com/docs/guides/speech-to-text
    # Needs internet access
    # Steps:
    # 1. Sign in at https://auth.openai.com/log-in
    # 2. Create an api-key at https://platform.openai.com/settings/organization/api-keys
    # 3. Pick gpt-4o-transcribe or gpt-4o-mini-transcribe
    type: openai
    api_key: <your-openai-api-key>
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech-to-text; create an API key in the Groq Console
    # Steps:
    # 1. Sign in at https://console.groq.com/home
    # 2. Create an api-key at https://console.groq.com/keys
    # 3. Pick whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en is English only)
    type: openai
    api_key: <your-groq-api-key>
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Website: https://alphacephei.com/vosk/
    # Notes:
    # 1. VOSK is an offline speech-recognition library with many languages
    # 2. Download a model first: https://alphacephei.com/vosk/models
    # 3. For Chinese use vosk-model-small-cn-0.22 or vosk-model-cn-0.22
    # 4. Runs fully offline
    # 5. Output is written to tmp/
    # Setup:
    # 1. Download a model from https://alphacephei.com/vosk/models
    # 2. Unpack it into models/vosk/ in the project directory
    # 3. Point model_path at it
    # 4. Note: the Chinese VOSK models emit no punctuation and put spaces between words
    type: vosk
    model_path: <your-vosk-model-path>  # e.g. models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Qwen3-ASR-Flash speech recognition; create an API key on Aliyun Bailian first
    # Steps:
    # 1. Sign in at https://bailian.console.aliyun.com/
    # 2. Create an API key at https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash is built on the Qwen multimodal base: multilingual, singing recognition, noise rejection
    type: qwen3_asr_flash
    api_key: <your-aliyun-bailian-api-key>
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR options
    enable_lid: true  # automatic language detection
    enable_itn: true  # inverse text normalisation
    #language: "zh"  # language: zh, en, ja, ko, ...
    context: ""  # context text to improve accuracy, up to 10000 tokens
  XunfeiStreamASR:
    # iFlytek (Xunfei) streaming speech recognition
    # Create an app on the iFlytek open platform to get the credentials below
    # Platform: https://www.xfyun.cn/
    # After creating the app, "My Apps" shows:
    # - APPID
    # - APISecret
    # - APIKey
    type: xunfei_stream
    # Required - iFlytek app credentials
    app_id: <your-xunfei-app-id>
    api_key: <your-xunfei-api-key>
    api_secret: <your-xunfei-api-secret>
    # Recognition parameters
    domain: slm # domain: iat = everyday speech, medical, finance, ...
    language: zh_cn # language: zh_cn Chinese, en_us English
    accent: mandarin # accent: mandarin
    # Tune audio handling for long utterances
    output_dir: tmp/
  AliyunBLStreamASR:
    # Aliyun Bailian Paraformer real-time speech recognition
    # WebSocket streaming with multilingual support, custom hot words and semantic sentence breaks
    # Console: https://bailian.console.aliyun.com/
    # API key: https://bailian.console.aliyun.com/#/api-key
    # Docs: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required
    api_key: <your-aliyun-bailian-api-key>
    # Model; v2 recommended
    model: paraformer-realtime-v2
    # Audio format and sample rate
    format: pcm
    sample_rate: 16000  # v2 accepts any rate, v1 only 16000, the 8k models only 8000
    # Optional
    disfluency_removal_enabled: false  # drop filler words ("um", "uh")
    semantic_punctuation_enabled: false  # semantic sentence breaks (true: meetings, accurate; false: VAD breaks, interactive, low latency)
    max_sentence_silence: 200  # VAD sentence-break silence (ms), 200-6000; VAD mode only
    multi_threshold_mode_enabled: false  # keep VAD segments from getting too long; VAD mode only
    punctuation_prediction_enabled: true  # add punctuation automatically
    inverse_text_normalization_enabled: true  # ITN (spell out numbers as digits)
    # Custom hot words: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # hot-word id (optional)
    # language_hints: ["zh", "en"]  # language hints (optional): zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # raise this if speakers pause for long

LLM:
  # Every openai-type entry accepts sampling parameters; see AliLLM for an example
