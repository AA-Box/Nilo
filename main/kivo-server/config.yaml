    # language: "English"  # output language, e.g. English, Chinese, Japanese, Korean; must match the voice; defaults to Chinese when unset
  CustomTTS:
    # Generic TTS endpoint with custom request parameters; works with many TTS services
    # Example: a local Kokoro TTS server
    # CPU only: docker run -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:latest
    # GPU: docker run --gpus all -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-gpu:latest
    # The endpoint must accept POST and return an audio file
    type: custom
    method: POST
    url: "http://127.0.0.1:8880/v1/audio/speech"
    params: # custom request parameters
      input: "{prompt_text}"
      response_format: "mp3"
      download_format: "mp3"
      voice: "zf_xiaoxiao"
      lang_code: "z"
      return_download_link: true
      speed: 1
      stream: false
    headers: # custom request headers
      # Authorization: Bearer xxxx
    format: mp3 # audio format returned by the endpoint
    output_dir: tmp/
    # language: "English"  # output language, e.g. English, Chinese, Japanese, Korean; must match the voice; defaults to Chinese when unset
  PaddleSpeechTTS:
    # Baidu PaddleSpeech: runs offline locally and supports training your own models
    # Framework: https://www.paddlepaddle.org.cn/
    # Project: https://github.com/PaddlePaddle/PaddleSpeech
    # Speech server demo: https://github.com/PaddlePaddle/PaddleSpeech/tree/develop/demos/speech_server
    # Streaming: https://github.com/PaddlePaddle/PaddleSpeech/wiki/PaddleSpeech-Server-WebSocket-API
    type: paddle_speech
    protocol: websocket # protocol choices = ['websocket', 'http']
    url: ws://127.0.0.1:8092/paddlespeech/tts/streaming  # TTS server URL [websocket default ws://127.0.0.1:8092/paddlespeech/tts/streaming, http default http://127.0.0.1:8090/paddlespeech/tts]
    spk_id: 0  # speaker id; 0 is usually the default speaker
    speed: 1.0  # speed; 1.0 normal, >1 faster, <1 slower
    volume: 1.0  # volume; 1.0 normal, >1 louder, <1 quieter
    save_path:   # save path
