    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: <your-chatglm-api-key>
  OllamaLLM:
    # LLM API type
    type: ollama
    model_name: qwen2.5 #  model name; pull it first with `ollama pull`
    base_url: http://localhost:11434  # Ollama server URL
  DifyLLM:
    # LLM API type
    type: dify
    # A self-hosted Dify endpoint is recommended; the public cloud endpoint may be blocked in some regions
    # With DifyLLM the prompt in this file is ignored; set it in the Dify console
    base_url: https://api.dify.ai/v1
    api_key: <your-dify-api-key>
    # Conversation mode: workflows/run (workflow), chat-messages (chat) or completion-messages (text generation)
    # For workflows the input variable is `query` and the output variable must be named `answer`
    # Text generation also takes `query` as its default input
    mode: chat-messages
  LangflowLLM:
    # LLM API type
    type: langflow
    # Langflow is a visual flow builder; flows are invoked through its API
