    api_key: <your-gemini-api-key>
    model_name: "gemini-2.0-flash"
    http_proxy: ""  #"http://127.0.0.1:10808"
    https_proxy: "" #http://127.0.0.1:10808"
  TCBAiLLM:
    # Tencent CloudBase - AI+ Agent platform
    # Agent API type
    type: openai
    # 1. Create a CloudBase environment at https://tcb.cloud.tencent.com/dev
