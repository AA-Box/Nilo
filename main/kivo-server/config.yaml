TTS:
  # Supported types: edge, doubao; add your own adapters as needed
  EdgeTTS:
    # TTS API type
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # language: "English"  # output language, e.g. English, Chinese, Japanese, Korean; must match the voice; defaults to Chinese when unset
  DoubaoTTS:
    # TTS API type
    type: doubao
    # Volcengine speech synthesis; create an app in the Volcengine console to get appid and access_token
    # A paid plan is strongly recommended: the entry tier (about CNY 30) gives 100 concurrent streams, the free tier only 2 and fails often
    # After buying a plan and a (free) voice, allow about half an hour before it works
    # Standard voices: https://console.volcengine.com/speech/service/8
    # The Wanwan Xiaohe voice: https://console.volcengine.com/speech/service/10007 - then set voice to zh_female_wanwanxiaohe_moon_bigtts
    api_url: https://openspeech.bytedance.com/api/v1/tts
    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: <your-volcengine-speech-appid>
    access_token: <your-volcengine-speech-access-token>
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # language: "English"  # output language, e.g. English, Chinese, Japanese, Korean; must match the voice; defaults to Chinese when unset
  # Volcengine TTS with bidirectional streaming
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Enable the large-model TTS and buy a voice at https://console.volcengine.com/speech/service/10007
    # appid and access_token are at the bottom of that page
    # Resource id is fixed: volc.service_type.10029 (large-model TTS and voice mixing)
    # For Gizwits use wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection instead; no appid is needed there
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: <your-volcengine-speech-appid>
    access_token: <your-volcengine-speech-access-token>
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    # Reuse the WebSocket connection (default on). Note: an idle reused connection counts against concurrency while the device is listening
    enable_ws_reuse: True
    # Parameter reference: https://www.volcengine.com/docs/6561/1329505
    # Audio output (audio_params) - any audio parameter Volcengine supports may be added
    audio_params:
      speech_rate: 0  # speed (-50~100)
      loudness_rate: 0  # volume (-50~100)
      # Emotion settings; only some voices support them
      # Voice list: https://www.volcengine.com/docs/6561/1257544
      # emotion: "neutral"  # emotion (some voices only): neutral, happy, sad, angry, fearful, disgusted, surprised
      # emotion_scale: 4  # emotion strength (1~5)
    # Advanced text processing (additions) - any advanced parameter Volcengine supports may be added
    additions:
      post_process:
        pitch: 0  # pitch (-12~12)
      # aigc_metadata: {}  # AIGC metadata
      # cache_config: {}  # caching
    # Voice mixing (mix_speaker) - blend several voices (TTS 1.0 only)
    # Mixing targets the Doubao TTS 1.0 voices; set req_params.speaker to custom_mix_bigtts when using it
    # mix_speaker:
    #   speakers:
    #     - source_speaker: zh_male_bvlazysheep
    #       mix_factor: 0.3
    #     - source_speaker: BV120_streaming
    #       mix_factor: 0.3
    #     - source_speaker: zh_male_ahu_conversation_wvae_bigtts
    #       mix_factor: 0.4
    # language: "English"  # output language, e.g. English, Chinese, Japanese, Korean; must match the voice; defaults to Chinese when unset
  # Doubao TTS 2.0 with bidirectional streaming (seed-tts-2.0 resource)
  HuoshanDoubleStreamTTSV2:
    type: huoshan_double_stream
    # Enable the large-model TTS and buy a voice at https://console.volcengine.com/speech/service/10035
    # appid and access_token are at the bottom of that page
    # Resource id is fixed: seed-tts-2.0 (Doubao TTS 2.0)
    # For Gizwits use wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection instead; no appid is needed there
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: <your-volcengine-speech-appid>
    access_token: <your-volcengine-speech-access-token>
    resource_id: seed-tts-2.0
    speaker: zh_female_xiaohe_uranus_bigtts
    # Reuse the WebSocket connection (default on). Note: an idle reused connection counts against concurrency while the device is listening
    enable_ws_reuse: True
    # Parameter reference: https://www.volcengine.com/docs/6561/1329505
    # Audio output (audio_params) - any audio parameter Volcengine supports may be added
    audio_params:
      speech_rate: 0  # speed (-50~100)
      loudness_rate: 0  # volume (-50~100)
    # Advanced text processing (additions) - any advanced parameter Volcengine supports may be added
    additions:
      post_process:
        pitch: 0  # pitch (-12~12)
    # language: "English"  # output language, e.g. English, Chinese, Japanese, Korean; must match the voice; defaults to Chinese when unset
