# kivo-server, standalone.
#   cp docker-compose.yml /srv/kivo/ && cd /srv/kivo && mkdir -p data models
#   docker compose up -d
# The server reads its user config from ./data/.config.yaml (mounted below);
# KIVO_* environment variables override server host/ports and log level.
services:
  kivo-server:
    image: ghcr.io/aa-box/kivo-server:latest
    container_name: kivo-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
      - KIVO_SERVER_HOST=0.0.0.0
      - KIVO_SERVER_PORT=8000
      - KIVO_HTTP_PORT=8003
      - KIVO_LOG_LEVEL=INFO
    ports:
      - "8000:8000"   # WebSocket session server (/kivo/v1/, /xiaozhi/v1/)
      - "8003:8003"   # HTTP: OTA bootstrap (/kivo/ota/, /xiaozhi/ota/) and /mcp/vision/explain
    volumes:
      - ./data:/opt/kivo-server/data
      # Local ASR model weights (FunASR SenseVoiceSmall) are not in the image; mount them if you use FunASR.
      - ./models/SenseVoiceSmall/model.pt:/opt/kivo-server/models/SenseVoiceSmall/model.pt
