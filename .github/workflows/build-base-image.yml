name: Build Base Image

on:
  push:
    branches:
      - main
    paths:
      - 'main/nilo-server/requirements.txt'
      - 'Dockerfile-server-base'
      - '.github/workflows/build-base-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/aa-box/nilo-server

jobs:
  build-base:
    name: Build and push nilo-server base image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server-base
          push: true
          tags: ${{ env.IMAGE }}:base
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=server-base
          cache-to: type=gha,mode=max,scope=server-base
